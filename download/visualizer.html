<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeGraph Visualizer v3.5</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0a0e14;--bg1:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --bd1:#262c36;--bd2:#30363d;--bd3:#3d444d;
  --t1:#e6edf3;--t2:#8b949e;--t3:#6e7681;--t4:#484f58;
  --blue:#58a6ff;--green:#3fb950;--purple:#bc8cff;--orange:#f0883e;
  --red:#ff7b72;--cyan:#56d4dd;--pink:#f778ba;--yellow:#d29922;
  --node-screen:#58a6ff;--node-component:#bc8cff;--node-hook:#56d4dd;
  --node-store:#f0883e;--node-service:#3fb950;--node-api:#ff7b72;
  --node-file:#8b949e;--node-package:#d29922;--node-endpoint:#f778ba;
  --node-function:#79c0ff;--node-class:#d2a8ff;--node-variable:#7ee787;
  --edge-import:#58a6ff;--edge-external:#d29922;--edge-jsx:#bc8cff;
  --edge-call:#3fb950;--edge-api_call:#ff7b72;--edge-contains:#484f58;
  --edge-extends:#f0883e;--edge-references:#56d4dd;
  --trace-1:#ff6b6b;--trace-2:#ffd93d;--trace-3:#6bcb77;--trace-4:#4d96ff;
  --trace-5:#ff922b;--trace-6:#cc5de8;--trace-7:#20c997;--trace-8:#845ef7;
  --r:8px;--shadow:0 8px 32px rgba(0,0,0,.5);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg0);color:var(--t1);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--bd2);z-index:100;flex-shrink:0;gap:12px}
.header-left{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
.logo-icon{width:22px;height:22px;color:var(--blue)}
.header-stats{display:flex;gap:14px;font-size:11px;color:var(--t3);white-space:nowrap}
.header-stats .n{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
.header-right{display:flex;gap:8px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;border:1px solid var(--bd3);background:var(--bg3);color:var(--t1);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg4);border-color:var(--t3)}
.btn-primary{background:#238636;border-color:#2ea043}.btn-primary:hover{background:#2ea043}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-trace{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:var(--trace-1)}
.btn-trace:hover{background:rgba(255,107,107,.25)}
.btn-trace.active{background:rgba(255,107,107,.3);border-color:var(--trace-1);box-shadow:0 0 8px rgba(255,107,107,.3)}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--bd2);flex-shrink:0;flex-wrap:wrap}
.search-box{position:relative;flex-shrink:0}
.search-box input{background:var(--bg3);border:1px solid var(--bd2);border-radius:6px;padding:6px 10px 6px 30px;color:var(--t1);font-size:12px;width:220px;outline:none;transition:border-color .12s}
.search-box input:focus{border-color:var(--blue)}
.search-box input::placeholder{color:var(--t4)}
.search-box svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t4);pointer-events:none}

/* ── VIEW TABS ── */
.view-tabs{display:flex;gap:2px;background:var(--bg1);border-radius:6px;padding:2px;flex-shrink:0}
.view-tab{padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;color:var(--t3);transition:all .12s;border:none;background:none}
.view-tab:hover{color:var(--t2)}
.view-tab.active{background:var(--bg3);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ── FILTER PILLS ── */
.filter-pills{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:100px;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .12s;user-select:none;text-transform:capitalize;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pill.active{opacity:1}.pill.inactive{opacity:.3}
.pill[data-t="screen"]{background:rgba(88,166,255,.12);color:var(--node-screen);border-color:rgba(88,166,255,.25)}
.pill[data-t="component"]{background:rgba(188,140,255,.12);color:var(--node-component);border-color:rgba(188,140,255,.25)}
.pill[data-t="hook"]{background:rgba(86,212,221,.12);color:var(--node-hook);border-color:rgba(86,212,221,.25)}
.pill[data-t="store"]{background:rgba(240,136,62,.12);color:var(--node-store);border-color:rgba(240,136,62,.25)}
.pill[data-t="service"]{background:rgba(63,185,80,.12);color:var(--node-service);border-color:rgba(63,185,80,.25)}
.pill[data-t="api"]{background:rgba(255,123,114,.12);color:var(--node-api);border-color:rgba(255,123,114,.25)}
.pill[data-t="function"]{background:rgba(121,192,255,.12);color:var(--node-function);border-color:rgba(121,192,255,.25)}
.pill[data-t="class"]{background:rgba(210,168,255,.12);color:var(--node-class);border-color:rgba(210,168,255,.25)}
.pill[data-t="file"]{background:rgba(139,148,158,.12);color:var(--node-file);border-color:rgba(139,148,158,.25)}
.pill[data-t="package"]{background:rgba(210,153,34,.12);color:var(--node-package);border-color:rgba(210,153,34,.25)}
.pill[data-t="endpoint"]{background:rgba(247,120,186,.12);color:var(--node-endpoint);border-color:rgba(247,120,186,.25)}

/* ── EDGE LEGEND ── */
.edge-legend{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--t3);flex-shrink:0;margin-left:auto}
.el-item{display:flex;align-items:center;gap:3px}
.el-line{width:16px;height:0}

/* ── MAIN ── */
.main-area{flex:1;position:relative;overflow:hidden;background:var(--bg0)}
#graph-canvas{width:100%;height:100%;cursor:grab}
#graph-canvas:active{cursor:grabbing}

/* ── DROP ZONE ── */
.drop-zone{position:fixed;inset:0;background:rgba(10,14,20,.94);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .2s}
.drop-zone.hidden{opacity:0;pointer-events:none}
.drop-box{border:2px dashed var(--blue);border-radius:16px;padding:50px 70px;text-align:center;background:var(--bg2);max-width:460px}
.drop-box h2{font-size:20px;margin-bottom:6px}
.drop-box p{color:var(--t2);font-size:13px;margin-bottom:16px}
.drop-box .or{color:var(--t4);margin:10px 0;font-size:11px;text-transform:uppercase;letter-spacing:1px}

/* ── SIDE PANEL ── */
.side-panel{position:absolute;top:0;right:0;width:400px;height:100%;background:var(--bg2);border-left:1px solid var(--bd2);z-index:50;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.side-panel.open{transform:translateX(0)}
.sp-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd2);flex-shrink:0}
.sp-header h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.sp-close{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center}
.sp-close:hover{color:var(--t1);background:var(--bg4)}
.sp-body{flex:1;overflow-y:auto;padding:14px}
.sp-body::-webkit-scrollbar{width:5px}.sp-body::-webkit-scrollbar-track{background:transparent}.sp-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.ds{margin-bottom:16px}
.ds h4{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);margin-bottom:6px;font-weight:600}
.ds-path{font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:11px;color:var(--blue);background:var(--bg3);padding:7px 9px;border-radius:5px;word-break:break-all;line-height:1.5}
.ds-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:100px;font-size:10px;font-weight:600;text-transform:capitalize}
.ds-loc{font-size:11px;color:var(--t2);margin-top:4px}
.ds-list{list-style:none}
.ds-list li{font-size:11px;padding:4px 7px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .08s}
.ds-list li:hover{background:var(--bg4)}
.ds-list .arrow{color:var(--t4);font-size:9px;flex-shrink:0}
.ds-list .nm{font-family:'SF Mono','Fira Code',monospace;font-size:10px;color:var(--blue)}
.ds-list .lb{color:var(--t2);font-size:10px}
.ds-empty{font-size:11px;color:var(--t4);font-style:italic}
.api-badge{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;font-family:'SF Mono',monospace;margin-right:3px}
.api-badge.get{background:rgba(63,185,80,.2);color:var(--green)}
.api-badge.post{background:rgba(88,166,255,.2);color:var(--blue)}
.api-badge.put{background:rgba(240,136,62,.2);color:var(--orange)}
.api-badge.delete{background:rgba(255,123,114,.2);color:var(--red)}
.api-badge.patch{background:rgba(188,140,255,.2);color:var(--purple)}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric-card{background:var(--bg3);border-radius:6px;padding:8px 10px}
.metric-card .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.metric-card .lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── TRACE PANEL ── */
.trace-panel{position:absolute;top:0;left:0;width:340px;height:100%;background:var(--bg2);border-right:1px solid var(--bd2);z-index:50;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.trace-panel.open{transform:translateX(0)}
.tp-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd2);flex-shrink:0;background:linear-gradient(135deg,rgba(255,107,107,.08),rgba(255,107,107,.02))}
.tp-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.tp-close{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center}
.tp-close:hover{color:var(--t1);background:var(--bg4)}
.tp-body{flex:1;overflow-y:auto;padding:0}
.tp-body::-webkit-scrollbar{width:5px}.tp-body::-webkit-scrollbar-track{background:transparent}.tp-body::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

.trace-list{list-style:none;padding:0}
.trace-item{padding:12px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:background .12s}
.trace-item:hover{background:var(--bg3)}
.trace-item.active{background:var(--bg4);border-left:3px solid var(--trace-1)}
.trace-item .ti-name{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.trace-item .ti-desc{font-size:10px;color:var(--t3);margin-bottom:6px;line-height:1.4}
.trace-item .ti-stats{display:flex;gap:10px;font-size:10px;color:var(--t2)}
.trace-item .ti-stats .ts-val{color:var(--t1);font-weight:600}

/* ── TRACE DETAIL VIEW ── */
.trace-detail{padding:14px}
.td-back{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--blue);cursor:pointer;margin-bottom:12px;padding:4px 0}
.td-back:hover{color:var(--t1)}
.td-title{font-size:16px;font-weight:700;margin-bottom:4px}
.td-desc{font-size:11px;color:var(--t2);margin-bottom:14px;line-height:1.5}
.td-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:16px}
.td-stat{background:var(--bg3);border-radius:6px;padding:8px;text-align:center}
.td-stat .sv{font-size:18px;font-weight:700}
.td-stat .sl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── TRACE TIMELINE ── */
.trace-timeline{margin-top:4px}
.tt-step{display:flex;gap:10px;padding:8px 0;position:relative;cursor:pointer;transition:background .08s;border-radius:4px;padding-left:8px;padding-right:8px}
.tt-step:hover{background:var(--bg3)}
.tt-step.hl{background:rgba(255,107,107,.1);border-radius:4px}
.tt-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:20px;position:relative}
.tt-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--bd3);background:var(--bg2);z-index:1;flex-shrink:0}
.tt-dot.entry{border-color:var(--green);background:var(--green);box-shadow:0 0 6px rgba(63,185,80,.4)}
.tt-dot.exit{border-color:var(--red);background:var(--red);box-shadow:0 0 6px rgba(255,123,114,.4)}
.tt-dot.api{border-color:var(--orange);background:var(--orange)}
.tt-dot.store{border-color:var(--cyan);background:var(--cyan)}
.tt-line{width:2px;flex:1;background:var(--bd3);min-height:12px}
.tt-content{flex:1;min-width:0}
.tt-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-meta{font-size:9px;color:var(--t3);display:flex;gap:6px;align-items:center;margin-top:2px}
.tt-meta .edge-tag{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:8px;font-weight:600;text-transform:uppercase}
.tt-badge{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase}
.tt-badge.entry{background:rgba(63,185,80,.15);color:var(--green)}
.tt-badge.exit{background:rgba(255,123,114,.15);color:var(--red)}
.tt-badge.api{background:rgba(240,136,62,.15);color:var(--orange)}
.tt-badge.store{background:rgba(86,212,221,.15);color:var(--cyan)}

/* ── ZOOM CONTROLS ── */
.zoom-controls{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:3px;z-index:40}
.zoom-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;color:var(--t2);cursor:pointer;font-size:15px;transition:all .12s}
.zoom-btn:hover{background:var(--bg4);color:var(--t1)}

/* ── LAYER INDICATOR ── */
.layer-indicator{position:absolute;top:12px;left:16px;z-index:40;display:flex;flex-direction:column;gap:4px}
.layer-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);background:var(--bg2);padding:3px 8px;border-radius:4px;border:1px solid var(--bd2)}
.layer-dot{width:6px;height:6px;border-radius:50%}

/* ── NO DATA ── */
.no-data{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t4);font-size:13px}
.no-data.hidden{display:none}
.spinner{width:28px;height:28px;border:3px solid var(--bd2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SVG ── */
.link{fill:none;stroke-opacity:.2;transition:stroke-opacity .12s}
.link.hl{stroke-opacity:.7}.link.dim{stroke-opacity:.04}
.link.trace-hl{stroke-opacity:1;stroke-width:2.5;filter:drop-shadow(0 0 3px currentColor)}
.node-c{stroke:var(--bg0);stroke-width:1.5;cursor:pointer;transition:stroke-width .1s}
.node-c:hover{stroke-width:2.5}
.node-c.sel{stroke:#fff;stroke-width:2.5}
.node-c.hl{stroke-width:2.5;filter:drop-shadow(0 0 5px currentColor)}
.node-c.dim{opacity:.12}
.node-c.trace-hl{stroke-width:3;filter:drop-shadow(0 0 8px currentColor);stroke:#fff}
.node-lbl{font-size:9px;fill:var(--t3);pointer-events:none;font-weight:500;text-anchor:middle}
.node-lbl.hl{fill:var(--t1);font-weight:700;font-size:10px}
.node-lbl.dim{opacity:.08}
.node-lbl.trace-hl{fill:var(--t1);font-weight:700;font-size:11px}
</style>
</head>
<body>

<!-- DROP ZONE -->
<div class="drop-zone" id="dropOverlay">
  <div class="drop-box">
    <h2>Open graph.json</h2>
    <p>Drag &amp; drop your <code>graph.json</code> file</p>
    <div class="or">or</div>
    <button class="btn btn-primary" id="browseBtn">Browse Files</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
      CodeGraph v3.5
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="header-right">
    <button class="btn btn-trace" id="traceToggleBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Traces
    </button>
    <button class="btn" id="loadNewBtn">Load New</button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar" id="toolbar" style="display:none">
  <div class="search-box">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search nodes...">
  </div>
  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="all">All</button>
    <button class="view-tab" data-view="dependency">Dependencies</button>
    <button class="view-tab" data-view="component">Components</button>
    <button class="view-tab" data-view="callgraph">Call Graph</button>
    <button class="view-tab" data-view="apiflow">API Flow</button>
    <button class="view-tab" data-view="architecture">Architecture</button>
  </div>
  <div class="filter-pills" id="filterPills"></div>
  <div class="edge-legend">
    <div class="el-item"><svg width="16" height="2"><line x1="0" y1="1" x2="16" y2="1" stroke="var(--edge-import)" stroke-width="1.5"/></svg>Import</div>
    <div class="el-item"><svg width="16" height="2"><line x1="0" y1="1" x2="16" y2="1" stroke="var(--edge-jsx)" stroke-width="1.5" stroke-dasharray="4,2"/></svg>JSX</div>
    <div class="el-item"><svg width="16" height="2"><line x1="0" y1="1" x2="16" y2="1" stroke="var(--edge-api_call)" stroke-width="1.5" stroke-dasharray="6,3"/></svg>API</div>
    <div class="el-item"><svg width="16" height="2"><line x1="0" y1="1" x2="16" y2="1" stroke="var(--edge-call)" stroke-width="1" stroke-dasharray="2,2"/></svg>Call</div>
    <div class="el-item"><svg width="16" height="2"><line x1="0" y1="1" x2="16" y2="1" stroke="var(--edge-contains)" stroke-width="1" stroke-dasharray="1,3"/></svg>Contains</div>
  </div>
</div>

<!-- MAIN -->
<div class="main-area" id="mainArea">
  <svg id="graph-canvas"></svg>
  <div class="no-data" id="noData"><span>Load graph.json to get started</span></div>

  <!-- Layer indicator -->
  <div class="layer-indicator" id="layerIndicator" style="display:none"></div>

  <!-- Trace panel (left) -->
  <div class="trace-panel" id="tracePanel">
    <div class="tp-header">
      <h3>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Workflow Traces
      </h3>
      <button class="tp-close" id="tpClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="tp-body" id="tpBody"></div>
  </div>

  <!-- Side panel (right) -->
  <div class="side-panel" id="sidePanel">
    <div class="sp-header">
      <h3 id="spTitle">Details</h3>
      <button class="sp-close" id="spClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sp-body" id="spBody"></div>
  </div>

  <!-- Zoom -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
    <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
    <button class="zoom-btn" id="zoomReset" title="Reset"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
</div>

<script>
(function(){
'use strict';

// ── COLORS ──
const NC={screen:'#58a6ff',component:'#bc8cff',hook:'#56d4dd',store:'#f0883e',service:'#3fb950',api:'#ff7b72',file:'#8b949e',package:'#d29922',endpoint:'#f778ba',function:'#79c0ff',class:'#d2a8ff',variable:'#7ee787'};
const EC={import:'#58a6ff',external:'#d29922',jsx:'#bc8cff',call:'#3fb950',api_call:'#ff7b72',contains:'#484f58',extends:'#f0883e',references:'#56d4dd'};
const EDASH={import:'none',external:'8,4',jsx:'4,2',call:'2,2',api_call:'6,3',contains:'1,3',extends:'10,3',references:'3,3'};
const NR={screen:11,component:9,hook:8,store:10,service:8,api:10,file:6,package:7,endpoint:7,function:5,class:8,variable:4};
const ICONS={screen:'\u{1F4F1}',component:'\u{1F9E9}',hook:'\u{1FA9D}',store:'\u{1F5C4}',service:'\u2699\uFE0F',api:'\u{1F310}',file:'\u{1F4C4}',package:'\u{1F4E6}',endpoint:'\u{1F50C}',function:'\u0192',class:'C',variable:'v'};

const LAYER_ORDER=['screen','component','hook','store','service','api','file','function','class','variable','package','endpoint'];
const LAYER_Y={screen:0,component:1,hook:2,store:3,service:4,api:5,file:6,function:7,class:7,variable:7,package:8,endpoint:5};

const TRACE_COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#20c997','#845ef7'];

// ── STATE ──
let data=null,sim=null,svg,g,linkG,nodeG,lblG,zoom;
let activeView='all',activeTypes=new Set(),searchTerm='',selectedNode=null;
let nodeMap={},allNodes=[],allEdges=[];
let _links,_nodeGs,_labels;
let activeTrace=null;
let tracePanelOpen=false;

// ── DOM ──
const $=id=>document.getElementById(id);
const dropOv=$('dropOverlay'),browseBtn=$('browseBtn'),fileIn=$('fileInput'),loadBtn=$('loadNewBtn');
const toolbar=$('toolbar'),pills=$('filterPills'),searchIn=$('searchInput'),hStats=$('headerStats');
const noData=$('noData'),sp=$('sidePanel'),spBody=$('spBody'),spClose=$('spClose'),spTitle=$('spTitle');
const viewTabs=$('viewTabs'),layerInd=$('layerIndicator');
const tracePanel=$('tracePanel'),tpBody=$('tpBody'),tpClose=$('tpClose'),traceToggleBtn=$('traceToggleBtn');

// ── LOAD ──
function loadData(d){
  data=d;nodeMap={};allNodes=d.nodes||[];allEdges=d.edges||[];
  allNodes.forEach(n=>nodeMap[n.id]=n);
  activeTypes=new Set(allNodes.map(n=>n.type));
  renderStats();renderPills();renderLayerIndicator();renderGraph();
  renderTracePanel();
  dropOv.classList.add('hidden');toolbar.style.display='flex';noData.classList.add('hidden');
}

function renderStats(){
  if(!data)return;const s=data.stats||{};
  const traceCount=data.traces?data.traces.length:0;
  hStats.innerHTML=`
    <span><span class="n">${allNodes.length}</span> nodes</span>
    <span><span class="n">${allEdges.length}</span> edges</span>
    <span><span class="n">${s.fileCount||'-'}</span> files</span>
    <span><span class="n">${(s.totalLOC||0).toLocaleString()}</span> LOC</span>
    <span style="color:var(--trace-1)"><span class="n">${traceCount}</span> traces</span>
    ${data.cycles?.length?`<span style="color:var(--red)"><span class="n">${data.cycles.length}</span> cycles</span>`:''}
  `;
}

function renderPills(){
  const types=[...new Set(allNodes.map(n=>n.type))];
  pills.innerHTML='';
  types.forEach(t=>{
    const p=document.createElement('span');
    p.className=`pill ${activeTypes.has(t)?'active':'inactive'}`;
    p.dataset.t=t;
    p.innerHTML=`<span class="dot" style="background:${NC[t]||'#888'}"></span>${t}`;
    p.onclick=()=>{activeTypes.has(t)?activeTypes.delete(t):activeTypes.add(t);
      document.querySelectorAll('.pill').forEach(p=>{p.classList.toggle('active',activeTypes.has(p.dataset.t));p.classList.toggle('inactive',!activeTypes.has(p.dataset.t))});
      applyFilters()};
    pills.appendChild(p);
  });
}

function renderLayerIndicator(){
  const types=[...new Set(allNodes.map(n=>n.type))].sort((a,b)=>(LAYER_Y[a]||9)-(LAYER_Y[b]||9));
  layerInd.innerHTML='';
  types.forEach(t=>{
    const row=document.createElement('div');row.className='layer-row';
    row.innerHTML=`<span class="layer-dot" style="background:${NC[t]||'#888'}"></span>${t} (${allNodes.filter(n=>n.type===t).length})`;
    layerInd.appendChild(row);
  });
  layerInd.style.display='flex';
}

// ── TRACE PANEL ──
function renderTracePanel(){
  if(!data||!data.traces||data.traces.length===0){
    tpBody.innerHTML='<div style="padding:20px;color:var(--t4);font-size:12px;text-align:center">No workflow traces detected.<br><br>Run <code style="background:var(--bg3);padding:2px 6px;border-radius:3px">node analyze.js --init-traces</code> to create custom trace definitions.</div>';
    return;
  }

  if(activeTrace){
    renderTraceDetail(activeTrace);
  } else {
    renderTraceList();
  }
}

function renderTraceList(){
  let h='<ul class="trace-list">';
  for(const t of data.traces){
    const color=TRACE_COLORS[data.traces.indexOf(t)%TRACE_COLORS.length];
    const status=t.stats.completePaths>0?'complete':'partial';
    h+=`<li class="trace-item" data-tid="${t.traceId}" onclick="window._openTrace('${t.traceId}')">
      <div class="ti-name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color}"></span>${t.icon||'🔍'} ${t.name}</div>
      <div class="ti-desc">${t.description||''}</div>
      <div class="ti-stats">
        <span><span class="ts-val">${t.stats.totalSteps}</span> steps</span>
        <span><span class="ts-val">${t.stats.subFlowCount}</span> sub-flows</span>
        <span><span class="ts-val">${t.stats.apiCallCount}</span> APIs</span>
        <span style="color:${t.stats.secureAccessCount>0?'var(--red)':'var(--t3)'}"><span class="ts-val">${t.stats.secureAccessCount}</span> secure</span>
      </div>
    </li>`;
  }
  h+='</ul>';
  tpBody.innerHTML=h;
}

let activeSubFlow=null;

function renderTraceDetail(trace){
  const color=TRACE_COLORS[data.traces.indexOf(trace)%TRACE_COLORS.length];
  let h='<div class="trace-detail">';
  h+=`<div class="td-back" onclick="window._backToTraces()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> All Traces</div>`;
  h+=`<div class="td-title" style="color:${color}">${trace.icon||'🔍'} ${trace.name}</div>`;
  h+=`<div class="td-desc">${trace.description||''}</div>`;
  h+=`<div class="td-stats">
    <div class="td-stat"><div class="sv" style="color:${color}">${trace.stats.totalSteps}</div><div class="sl">Steps</div></div>
    <div class="td-stat"><div class="sv">${trace.stats.uniqueFiles}</div><div class="sl">Files</div></div>
    <div class="td-stat"><div class="sv" style="color:var(--orange)">${trace.stats.apiCallCount}</div><div class="sl">APIs</div></div>
    <div class="td-stat"><div class="sv" style="color:var(--cyan)">${trace.stats.secureAccessCount}</div><div class="sl">Secure</div></div>
    <div class="td-stat"><div class="sv" style="color:var(--purple)">${trace.stats.dispatchCount}</div><div class="sl">Dispatch</div></div>
    <div class="td-stat"><div class="sv">${trace.stats.subFlowCount}/${trace.stats.totalSubFlows}</div><div class="sl">Sub-Flows</div></div>
  </div>`;

  // Sub-flow tabs
  if(trace.subFlows&&trace.subFlows.length>0){
    h+='<div class="ds" style="margin-bottom:12px"><h4>Sub-Flows</h4><div style="display:flex;flex-wrap:wrap;gap:4px">';
    for(const sf of trace.subFlows){
      const sfColor=sf.stats.completePaths>0?'var(--green)':'var(--yellow)';
      const isActive=activeSubFlow&&activeSubFlow.id===sf.id;
      h+=`<span class="pill ${isActive?'active':'inactive'}" style="background:rgba(${isActive?'88,166,255':'139,148,158'},.12);color:${isActive?'var(--blue)':'var(--t2)'};border-color:${isActive?'rgba(88,166,255,.4)':'var(--bd3)'};cursor:pointer;font-size:9px;padding:3px 8px" onclick="window._selectSubFlow('${trace.traceId}','${sf.id}')">${sf.name} (${sf.stats.totalSteps})</span>`;
    }
    h+='</div></div>';
  }

  // Timeline (show active sub-flow or all)
  const activeSpans=activeSubFlow?activeSubFlow.spans:[];
  const activeNarrative=activeSubFlow?activeSubFlow.narrative:(trace.subFlows&&trace.subFlows.length>0?trace.subFlows.flatMap(sf=>sf.narrative):trace.narrative||[]);
  h+='<div class="trace-timeline">';
  const seen=new Set();
  for(let i=0;i<activeNarrative.length;i++){
    const step=activeNarrative[i];
    if(seen.has(step.nodeId))continue;
    seen.add(step.nodeId);
    const isLast=i===activeNarrative.length-1;
    const dotClass=step.isEntry?'entry':step.isExit?'exit':(step.edgeKind==='api_call'?'api':step.type==='store'?'store':'');
    const dotColor=NC[step.type]||'var(--bd3)';
    const badges=[];
    if(step.isEntry)badges.push('<span class="tt-badge entry">START</span>');
    if(step.isExit)badges.push('<span class="tt-badge exit">END</span>');
    if(step.edgeKind==='api_call')badges.push('<span class="tt-badge api">API</span>');
    if(step.type==='store')badges.push('<span class="tt-badge store">STORE</span>');

    h+=`<div class="tt-step" data-nid="${step.nodeId}" onclick="window._hlTraceNode('${step.nodeId}')">
      <div class="tt-rail">
        <div class="tt-dot ${dotClass}" style="${dotClass?'':`border-color:${dotColor};background:${dotColor}22`}"></div>
        ${!isLast?'<div class="tt-line"></div>':''}
      </div>
      <div class="tt-content">
        <div class="tt-name" style="color:${dotColor}">${ICONS[step.type]||''} ${step.name}</div>
        <div class="tt-meta">
          <span>${step.type}</span>
          ${step.file_path?`<span style="color:var(--t4)">${step.file_path.split('/').pop()}</span>`:''}
          ${step.edgeKind&&step.edgeKind!=='entry'?`<span class="edge-tag">${step.edgeKind}</span>`:''}
          ${badges.join('')}
        </div>
      </div>
    </div>`;
  }
  h+='</div>';

  // Use active sub-flow's data or aggregate from all
  const activeData=activeSubFlow||trace;
  const activeApiCalls=activeSubFlow?activeSubFlow.apiCalls:trace.subFlows?trace.subFlows.flatMap(sf=>sf.apiCalls):trace.apiCalls||[];
  const activeStoreAccess=activeSubFlow?activeSubFlow.storeAccess:trace.subFlows?trace.subFlows.flatMap(sf=>sf.storeAccess):trace.storeAccess||[];
  const activeSecureAccess=activeSubFlow?activeSubFlow.secureAccess:trace.subFlows?trace.subFlows.flatMap(sf=>sf.secureAccess):[];
  const activeDispatches=activeSubFlow?activeSubFlow.dispatches:trace.subFlows?trace.subFlows.flatMap(sf=>sf.dispatches):[];
  const activePaths=activeSubFlow?activeSubFlow.paths:trace.subFlows?trace.subFlows.flatMap(sf=>sf.paths):trace.paths||[];

  // Secure Storage
  if(activeSecureAccess&&activeSecureAccess.length>0){
    h+='<div class="ds" style="margin-top:16px"><h4 style="color:var(--red)">Secure Storage Access</h4><ul class="ds-list">';
    for(const s of activeSecureAccess){
      h+=`<li><span style="color:var(--red)">!</span><span class="nm">${s.action} ${s.key||''}</span><span class="lb">from ${s.fromName||s.from}</span></li>`;
    }
    h+='</ul></div>';
  }

  // API Calls
  if(activeApiCalls&&activeApiCalls.length>0){
    h+='<div class="ds" style="margin-top:8px"><h4>API Calls</h4><ul class="ds-list">';
    for(const api of activeApiCalls){
      const isAuth=api.tags&&api.tags.includes('auth-api');
      h+=`<li><span class="api-badge get">${api.method||'CALL'}</span><span class="nm">${api.url||'-'}</span><span class="lb">from ${api.fromName||api.from}${isAuth?' [AUTH]':''}</span></li>`;
    }
    h+='</ul></div>';
  }

  // Store Access
  if(activeStoreAccess&&activeStoreAccess.length>0){
    h+='<div class="ds" style="margin-top:8px"><h4>Store Access</h4><ul class="ds-list">';
    for(const s of activeStoreAccess){
      const isSecure=s.tags&&s.tags.includes('secure-storage');
      h+=`<li><span style="color:${isSecure?'var(--red)':'var(--cyan)'}">${isSecure?'!':'+'}</span><span class="nm">${s.storeName||s.store}</span><span class="lb">from ${s.fromName||s.from}${isSecure?' [SECURE]':''}</span></li>`;
    }
    h+='</ul></div>';
  }

  // Dispatches
  if(activeDispatches&&activeDispatches.length>0){
    h+='<div class="ds" style="margin-top:8px"><h4>State Dispatches</h4><ul class="ds-list">';
    for(const d of activeDispatches){
      h+=`<li><span style="color:var(--purple)">dispatch</span><span class="nm">${d.actionType||'action'}</span><span class="lb">from ${d.fromName||d.from}</span></li>`;
    }
    h+='</ul></div>';
  }

  // Paths
  if(activePaths&&activePaths.length>0){
    h+='<div class="ds" style="margin-top:8px"><h4>Discovered Paths ('+activePaths.length+')</h4><ul class="ds-list">';
    for(let pi=0;pi<Math.min(activePaths.length,5);pi++){
      const p=activePaths[pi];
      const entryN=nodeMap[p.entryId]||{name:p.entryId};
      const exitN=p.exitNodeId?(nodeMap[p.exitNodeId]||{name:p.exitNodeId}):null;
      h+=`<li><span class="arrow">${p.reachedExit?'>>':'>'}</span><span class="nm">${entryN.name}</span><span class="lb">-> ${exitN?exitN.name:'...'} (${p.steps.length} steps)${p.reachedExit?' complete':''}</span></li>`;
    }
    h+='</ul></div>';
  }

  h+='</div>';
  tpBody.innerHTML=h;
}

window._openTrace=function(traceId){
  if(!data||!data.traces)return;
  activeTrace=data.traces.find(t=>t.traceId===traceId);
  activeSubFlow=null;
  if(activeTrace){
    renderTraceDetail(activeTrace);
    highlightTraceOnGraph(activeTrace);
  }
};

window._selectSubFlow=function(traceId,subFlowId){
  if(!data||!data.traces)return;
  const trace=data.traces.find(t=>t.traceId===traceId);
  if(!trace)return;
  activeSubFlow=trace.subFlows.find(sf=>sf.id===subFlowId);
  renderTraceDetail(trace);
  if(activeSubFlow)highlightSubFlowOnGraph(activeSubFlow);
};

window._backToTraces=function(){
  activeTrace=null;
  renderTraceList();
  clearTraceHighlight();
};

window._hlTraceNode=function(nodeId){
  // Highlight specific node on graph
  _nodeGs?.selectAll('.node-c').classed('trace-hl',d=>d.id===nodeId);
  _labels?.classed('trace-hl',d=>d.id===nodeId);
  _links?.classed('trace-hl',d=>(d.source.id||d.source)===nodeId||(d.target.id||d.target)===nodeId);

  // Zoom to node
  const n=window._nodes?.find(n=>n.id===nodeId);
  if(n&&svg&&zoom){
    svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(svg.node().clientWidth/2-n.x*1.5,svg.node().clientHeight/2-n.y*1.5).scale(1.5));
  }

  // Also show side panel
  if(n)selectNode(n);
};

function highlightTraceOnGraph(trace){
  if(!trace)return;
  const traceNodeIds=new Set();
  // Aggregate from all sub-flows
  if(trace.subFlows){
    for(const sf of trace.subFlows){
      for(const span of sf.spans){traceNodeIds.add(span.nodeId);}
      for(const step of sf.narrative){traceNodeIds.add(step.nodeId);}
    }
  }
  // Fallback for flat trace
  for(const step of (trace.narrative||[])){traceNodeIds.add(step.nodeId);}
  for(const span of (trace.spans||[])){traceNodeIds.add(span.nodeId);}

  _nodeGs?.selectAll('.node-c')
    .classed('trace-hl',d=>traceNodeIds.has(d.id))
    .classed('dim',d=>!traceNodeIds.has(d.id));
  _labels?.classed('trace-hl',d=>traceNodeIds.has(d.id)).classed('dim',d=>!traceNodeIds.has(d.id));
  _links?.classed('trace-hl',d=>traceNodeIds.has(d.source.id||d.source)&&traceNodeIds.has(d.target.id||d.target))
    .classed('dim',d=>!traceNodeIds.has(d.source.id||d.source)||!traceNodeIds.has(d.target.id||d.target));
}

function highlightSubFlowOnGraph(subFlow){
  if(!subFlow)return;
  const sfNodeIds=new Set();
  for(const span of subFlow.spans)sfNodeIds.add(span.nodeId);
  for(const step of subFlow.narrative)sfNodeIds.add(step.nodeId);

  _nodeGs?.selectAll('.node-c')
    .classed('trace-hl',d=>sfNodeIds.has(d.id))
    .classed('dim',d=>!sfNodeIds.has(d.id));
  _labels?.classed('trace-hl',d=>sfNodeIds.has(d.id)).classed('dim',d=>!sfNodeIds.has(d.id));
  _links?.classed('trace-hl',d=>sfNodeIds.has(d.source.id||d.source)&&sfNodeIds.has(d.target.id||d.target))
    .classed('dim',d=>!sfNodeIds.has(d.source.id||d.source)||!sfNodeIds.has(d.target.id||d.target));
}

function clearTraceHighlight(){
  _nodeGs?.selectAll('.node-c').classed('trace-hl',false).classed('dim',false);
  _labels?.classed('trace-hl',false).classed('dim',false);
  _links?.classed('trace-hl',false).classed('dim',false);
}

// ── VIEW TABS ──
viewTabs.addEventListener('click',e=>{
  if(!e.target.classList.contains('view-tab'))return;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  activeView=e.target.dataset.view;
  applyFilters();
});

// ── GRAPH ──
function getEdgeKindsForView(view){
  switch(view){
    case 'dependency':return['import','external'];
    case 'component':return['jsx','contains'];
    case 'callgraph':return['call','references'];
    case 'apiflow':return['api_call'];
    case 'architecture':return['import','external','call','api_call'];
    default:return null;
  }
}

function getNodeTypesForView(view){
  switch(view){
    case 'dependency':return['file','screen','component','hook','store','service','api','package'];
    case 'component':return['component','screen','hook'];
    case 'callgraph':return['function','hook','class','store','service','api'];
    case 'apiflow':return['screen','component','hook','service','api','endpoint'];
    case 'architecture':return['screen','component','store','service','api','endpoint'];
    default:return null;
  }
}

function renderGraph(){
  if(sim)sim.stop();
  svg=d3.select('#graph-canvas');svg.selectAll('*').remove();

  zoom=d3.zoom().scaleExtent([.05,6]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);

  // Arrow markers
  const defs=svg.append('defs');
  Object.entries(EC).forEach(([k,c])=>{
    defs.append('marker').attr('id',`arr-${k}`).attr('viewBox','0 -5 10 10').attr('refX',18).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('fill',c).attr('d','M0,-4L10,0L0,4');
  });

  g=svg.append('g');
  linkG=g.append('g').attr('class','links');
  nodeG=g.append('g').attr('class','nodes');
  lblG=g.append('g').attr('class','labels');

  const W=svg.node().clientWidth,H=svg.node().clientHeight;
  const edgeKinds=getEdgeKindsForView(activeView);
  const nodeTypes=getNodeTypesForView(activeView);
  const isArchitecture=activeView==='architecture';

  // Filter nodes
  let visNodes=allNodes.filter(n=>{
    if(!activeTypes.has(n.type))return false;
    if(nodeTypes&&!nodeTypes.includes(n.type))return false;
    return true;
  });
  const visIds=new Set(visNodes.map(n=>n.id));

  // Filter edges
  let visEdges=allEdges.filter(e=>{
    const sid=e.source.id||e.source,tid=e.target.id||e.target;
    if(!visIds.has(sid)||!visIds.has(tid))return false;
    if(edgeKinds&&!edgeKinds.includes(e.kind))return false;
    return true;
  });

  // D3 data
  const nodes=visNodes.map(n=>({...n,x:Math.random()*W,y:isArchitecture?(LAYER_Y[n.type]||5)*(H/10)+50:Math.random()*H}));
  const byId={};nodes.forEach(n=>byId[n.id]=n);
  const edges=visEdges.map(e=>({...e,source:byId[e.source.id||e.source]||e.source,target:byId[e.target.id||e.target]||e.target})).filter(e=>byId[e.source.id||e.source]&&byId[e.target.id||e.target]);

  // ── Links ──
  _links=linkG.selectAll('line').data(edges).join('line')
    .attr('class','link')
    .attr('stroke',d=>EC[d.kind]||'#444')
    .attr('stroke-width',d=>d.kind==='contains'?.5:d.kind==='import'?1.2:1)
    .attr('stroke-dasharray',d=>EDASH[d.kind]||'none')
    .attr('marker-end',d=>`url(#arr-${d.kind})`);

  // ── Nodes ──
  _nodeGs=nodeG.selectAll('g').data(nodes,d=>d.id).join('g')
    .call(d3.drag().on('start',dragS).on('drag',dragM).on('end',dragE));

  _nodeGs.append('circle').attr('class','node-c')
    .attr('r',d=>NR[d.type]||6)
    .attr('fill',d=>NC[d.type]||'#888')
    .on('click',(e,d)=>selectNode(d));

  // ── Labels ──
  _labels=lblG.selectAll('text').data(nodes,d=>d.id).join('text')
    .attr('class','node-lbl')
    .attr('dy',d=>(NR[d.type]||6)+11)
    .text(d=>{const p=(d.qualified_name||d.name||d.id).split('::').pop();return p.replace(/\.(js|jsx|ts|tsx)$/,'')});

  // ── Simulation ──
  const forces=[
    d3.forceLink(edges).id(d=>d.id).distance(d=>{
      if(d.kind==='api_call')return 110;if(d.kind==='jsx')return 70;if(d.kind==='contains')return 40;return 55;
    }).strength(.3),
    d3.forceManyBody().strength(d=>-(NR[d.type]||6)*35),
    d3.forceCenter(W/2,H/2),
    d3.forceCollide().radius(d=>(NR[d.type]||6)+6),
  ];

  if(isArchitecture){
    forces.push(d3.forceY(d=>(LAYER_Y[d.type]||5)*(H/10)+50).strength(.8));
    forces.push(d3.forceX(W/2).strength(.05));
  } else {
    forces.push(d3.forceX(W/2).strength(.02));
    forces.push(d3.forceY(H/2).strength(.02));
  }

  sim=d3.forceSimulation(nodes).alphaDecay(.02)
    .force('link',forces[0]).force('charge',forces[1]).force('center',forces[2]).force('collide',forces[3]);
  if(isArchitecture){sim.force('yLayer',forces[4]).force('xCenter',forces[5])}
  else{sim.force('x',forces[4]).force('y',forces[5])}

  sim.on('tick',()=>{
    _links.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    _nodeGs.attr('transform',d=>`translate(${d.x},${d.y})`);
    _labels.attr('x',d=>d.x).attr('y',d=>d.y);
  });

  window._nodes=nodes;window._edges=edges;

  // Auto-fit
  setTimeout(()=>{
    const b=g.node().getBBox();if(!b.width)return;
    const s=.75/Math.max(b.width/W,b.height/H);
    svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2-s*(b.x+b.width/2),H/2-s*(b.y+b.height/2)).scale(s));
  },1200);

  // Re-apply trace highlight if active
  if(activeSubFlow)highlightSubFlowOnGraph(activeSubFlow);
  else if(activeTrace)highlightTraceOnGraph(activeTrace);
}

function applyFilters(){renderGraph();if(searchTerm)applySearch(searchTerm)}

function applySearch(term){
  term=term.toLowerCase();
  if(!term){_nodeGs?.selectAll('.node-c').classed('hl',false).classed('dim',false);_labels?.classed('hl',false).classed('dim',false);_links?.classed('hl',false).classed('dim',false);return}
  const matchIds=new Set();
  allNodes.forEach(n=>{
    const s=[n.name,n.id,n.qualified_name,n.file_path,n.kind,JSON.stringify(n.metadata||'')].join(' ').toLowerCase();
    if(s.includes(term))matchIds.add(n.id);
  });
  _nodeGs?.selectAll('.node-c').classed('hl',d=>matchIds.has(d.id)).classed('dim',d=>!matchIds.has(d.id));
  _labels?.classed('hl',d=>matchIds.has(d.id)).classed('dim',d=>!matchIds.has(d.id));
  _links?.classed('hl',d=>matchIds.has(d.source.id||d.source)||matchIds.has(d.target.id||d.target)).classed('dim',d=>!matchIds.has(d.source.id||d.source)&&!matchIds.has(d.target.id||d.target));
}

// ── SELECT NODE ──
function selectNode(d){
  selectedNode=d;
  _nodeGs?.selectAll('.node-c').classed('sel',n=>n.id===d.id);
  renderSP(d);sp.classList.add('open');
}

function renderSP(d){
  const c=NC[d.type]||'#888',ic=ICONS[d.type]||'?';
  const name=d.name||d.id.split('::').pop()||d.id;
  spTitle.innerHTML=`<span style="font-size:15px">${ic}</span> ${name}`;

  const incoming=allEdges.filter(e=>(e.target.id||e.target)===d.id);
  const outgoing=allEdges.filter(e=>(e.source.id||e.source)===d.id);

  let h='';

  // Type + metrics
  h+=`<div class="ds"><h4>Type</h4><span class="ds-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${ic} ${d.type}</span></div>`;

  // Path
  if(d.file_path)h+=`<div class="ds"><h4>Path</h4><div class="ds-path">${d.file_path}</div></div>`;
  if(d.qualified_name&&d.qualified_name!==d.file_path)h+=`<div class="ds"><h4>Qualified Name</h4><div class="ds-path">${d.qualified_name}</div></div>`;

  // Metrics
  if(d.fan_in!==undefined||d.fan_out!==undefined||d.instability!==undefined){
    h+=`<div class="ds"><h4>Metrics</h4><div class="metric-grid">
      <div class="metric-card"><div class="val" style="color:var(--green)">${d.fan_in||0}</div><div class="lbl">Fan-in</div></div>
      <div class="metric-card"><div class="val" style="color:var(--blue)">${d.fan_out||0}</div><div class="lbl">Fan-out</div></div>
      <div class="metric-card"><div class="val" style="color:var(--orange)">${d.instability!==undefined?d.instability.toFixed(2):'-'}</div><div class="lbl">Instability</div></div>
      <div class="metric-card"><div class="val">${(d.fan_in||0)+(d.fan_out||0)}</div><div class="lbl">Total</div></div>
    </div></div>`;
  }

  // Size
  if(d.start_line&&d.end_line)h+=`<div class="ds"><h4>Lines</h4><div class="ds-loc">${d.start_line}-${d.end_line} (${d.end_line-d.start_line+1} lines)</div></div>`;

  // Signature
  if(d.signature)h+=`<div class="ds"><h4>Signature</h4><div class="ds-path">${d.signature}</div></div>`;

  // Visibility / flags
  const flags=[];
  if(d.is_exported)flags.push('exported');if(d.is_async)flags.push('async');if(d.is_static)flags.push('static');
  if(d.visibility&&d.visibility!=='public')flags.push(d.visibility);
  if(flags.length)h+=`<div class="ds"><h4>Flags</h4><div>${flags.map(f=>`<span class="ds-badge" style="background:var(--bg3);color:var(--t2);font-size:9px;border:1px solid var(--bd3)">${f}</span>`).join(' ')}</div></div>`;

  // Traces containing this node
  if(data&&data.traces){
    const containingTraces=[];
    for(const t of data.traces){
      const subFlowMatches=[];
      if(t.subFlows){
        for(const sf of t.subFlows){
          if(sf.spans&&sf.spans.some(s=>s.nodeId===d.id)){
            subFlowMatches.push(sf);
          }
        }
      }
      // Fallback for flat traces
      if(!t.subFlows&&t.spans&&t.spans.some(s=>s.nodeId===d.id)){
        containingTraces.push({trace:t,subFlow:null,span:t.spans.find(s=>s.nodeId===d.id)});
      }
      for(const sf of subFlowMatches){
        containingTraces.push({trace:t,subFlow:sf,span:sf.spans.find(s=>s.nodeId===d.id)});
      }
    }
    if(containingTraces.length>0){
      h+=`<div class="ds"><h4>Workflow Traces (${containingTraces.length})</h4><ul class="ds-list">`;
      for(const ct of containingTraces){
        const color=TRACE_COLORS[data.traces.indexOf(ct.trace)%TRACE_COLORS.length];
        const sfLabel=ct.subFlow?` / ${ct.subFlow.name}`:'';
        h+=`<li onclick="window._openTrace('${ct.trace.traceId}')" style="cursor:pointer"><span style="color:${color}">+</span><span class="nm">${ct.trace.icon||'🔍'} ${ct.trace.name}${sfLabel}</span><span class="lb">${ct.span.isEntry?'entry':ct.span.isExit?'exit':ct.span.edgeKind}</span></li>`;
      }
      h+='</ul></div>';
    }
  }

  // API calls
  const apiEdges=outgoing.filter(e=>e.kind==='api_call');
  if(apiEdges.length){
    h+=`<div class="ds"><h4>API Calls (${apiEdges.length})</h4><ul class="ds-list">`;
    apiEdges.forEach(e=>{
      const m=e.metadata||{};const method=(m.method||'GET').toLowerCase();
      h+=`<li><span class="api-badge ${method}">${m.method||'GET'}</span><span class="nm">${m.url||e.label||'-'}</span><span class="lb">${m.type||e.kind}</span></li>`;
    });
    h+=`</ul></div>`;
  }

  // Incoming
  if(incoming.length){
    h+=`<div class="ds"><h4>Incoming (${incoming.length})</h4><ul class="ds-list">`;
    incoming.forEach(e=>{
      const sid=e.source.id||e.source;const sn=nodeMap[sid];const sc=sn?NC[sn.type]||'#888':'#888';
      h+=`<li onclick="window._selById('${sid}')"><span class="arrow"><-</span><span style="color:${sc}">.</span><span class="nm">${sn?sn.name:sid.split('::').pop()}</span><span class="lb">${e.kind}${e.label?': '+e.label:''}</span></li>`;
    });
    h+=`</ul></div>`;
  }

  // Outgoing
  if(outgoing.length){
    h+=`<div class="ds"><h4>Outgoing (${outgoing.length})</h4><ul class="ds-list">`;
    outgoing.forEach(e=>{
      const tid=e.target.id||e.target;const tn=nodeMap[tid];const tc=tn?NC[tn.type]||'#888':'#888';
      h+=`<li onclick="window._selById('${tid}')"><span class="arrow">-></span><span style="color:${tc}">.</span><span class="nm">${tn?tn.name:tid.split('::').pop()}</span><span class="lb">${e.kind}${e.label?': '+e.label:''}</span></li>`;
    });
    h+=`</ul></div>`;
  }

  if(!incoming.length&&!outgoing.length)h+=`<div class="ds"><p class="ds-empty">No connections</p></div>`;

  spBody.innerHTML=h;
}

window._selById=function(id){const n=window._nodes?.find(n=>n.id===id);if(n)selectNode(n)};

// ── DRAG ──
function dragS(e,d){if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}
function dragM(e,d){d.fx=e.x;d.fy=e.y}
function dragE(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}

// ── ZOOM ──
$('zoomIn').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.4);
$('zoomOut').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,.7);
$('zoomReset').onclick=()=>{
  svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);
  setTimeout(()=>{const b=g.node().getBBox();if(!b.width)return;const W=svg.node().clientWidth,H=svg.node().clientHeight;const s=.75/Math.max(b.width/W,b.height/H);
    svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(W/2-s*(b.x+b.width/2),H/2-s*(b.y+b.height/2)).scale(s))},50);
};

// ── SIDE PANEL ──
spClose.onclick=()=>{sp.classList.remove('open');selectedNode=null;_nodeGs?.selectAll('.node-c').classed('sel',false)};

// ── TRACE PANEL ──
traceToggleBtn.onclick=()=>{
  tracePanelOpen=!tracePanelOpen;
  tracePanel.classList.toggle('open',tracePanelOpen);
  traceToggleBtn.classList.toggle('active',tracePanelOpen);
};
tpClose.onclick=()=>{
  tracePanelOpen=false;
  tracePanel.classList.remove('open');
  traceToggleBtn.classList.remove('active');
  activeTrace=null;
  activeSubFlow=null;
  clearTraceHighlight();
};

// ── SEARCH ──
searchIn.oninput=e=>{searchTerm=e.target.value;applySearch(searchTerm)};

// ── FILE INPUT ──
browseBtn.onclick=()=>fileIn.click();
loadBtn.onclick=()=>fileIn.click();
fileIn.onchange=e=>{const f=e.target.files[0];if(f)readFile(f)};

// ── DRAG & DROP ──
document.ondragover=e=>{e.preventDefault();dropOv.classList.remove('hidden')};
dropOv.ondragover=e=>e.preventDefault();
dropOv.ondragleave=e=>{if(!dropOv.contains(e.relatedTarget))dropOv.classList.add('hidden')};
dropOv.ondrop=e=>{e.preventDefault();dropOv.classList.add('hidden');const f=e.dataTransfer.files[0];if(f&&f.name.endsWith('.json'))readFile(f)};

function readFile(file){
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.nodes&&d.edges)loadData(d);else alert('Invalid graph.json')}catch(err){alert('Parse error: '+err.message)}};
  r.readAsText(file);
}

// ── RESIZE ──
window.onresize=()=>{if(sim){const W=svg.node().clientWidth,H=svg.node().clientHeight;sim.force('center',d3.forceCenter(W/2,H/2));sim.alpha(.3).restart()}};

})();
</script>
</body>
